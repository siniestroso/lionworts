- id: 1
  title: THE INVITATION
  description: >-
    Fall is roaring its way back into the Great City of Liondon. Wind and rain bluster in out of the north, and dead
    leaves glob in wet piles on the cobblestones. The majestic spires of the skyline rise against the clouds, but on the
    streets below, Lions and Cubs just lower their heads against the weather and hurry home for tea.
    <br><br>
    Late one night, you are alone in the den of your foster-family’s home, struggling to focus on your book report for
    tomorrow’s Antelopes Anatomy class. The fire crackles low in the hearth, and you yawn lazily as you flip through
    P.J. Blank’s My Time with the Herds of the Greater Savanna, Second Edition.
    <br><br>
    Suddenly, you are surprised by a metallic ka-chunk of the mail slot at the front door, the drop of what sounds like
    a heavy envelope, and the flapping of large wings fading off into the rainy night. Who could it be at this late
    hour?
    <br><br>
    Shaken alert, you spring down the hall to discover a black paper parcel on the floor, with your name embossed in
    sparkling silver lettering! You turn the envelope over in your paw to see the return label:
    <br><br>
    <b>“The Lionworts Academy for Preternaturally Gifted Cubs, Lionworts School of Magick”</b>
    <br><br>
    Your breath catches in your throat... Lionworts? The Lionworts? Immediately you wonder if you’re not at the tail end
    of some prank by your littermates. Every Cub has heard the many rumors of Lionworts, but no one has ever been able
    to say if it’s actually real.
    <br><br>
    You quickly return to the hearth to get a better look at the envelope in the firelight. With a nervous paw, you
    break open the silver wax seal and unfold the black paper letter:
    <br><br>
    <strong>“Congratulations, Young Lion, on your Acceptance to the Lionworts Academy for Preternaturally Gifted Cubs at the
    Lionworts School of Magick!”</strong>
    <br><br>
    To answer your question, yes! This letter of correspondence is indeed a very real letter of correspondence from
    Liondon’s most prestigious and only school for the Oracular and Practical Mystical Arts.
    <br><br>
    Please be sure to attend Lionworts Orientation for Novice Cubs at midnight on the night of the Serpent Moon.
    <br><br>
    Your RSVP is not required, but your attendance is mandatory.
    <br><br>
    Signed,
    <br><br>
    Llewellyn Bonisagus
    <br><br>
    Wizard of the Nineteenth Order (ret.) Lionworts Dean of Admissions Seventh Cub of a Seventh Litter
    <br><br>
    P.S. Please do not be late.
    <br><br>
    P.P.S. Why are you still reading this?! It’s almost midnight!”
    <br><br>
    With a start, you realize that the night of the Serpent Moon is tonight! But where do you go?
    <br><br>
    The letter in your paws suddenly erupts in cold silver flame, and soot and thin glittering letters sprinkle down to
    the floor. The fire in the hearth roars silver, and a cool draught washes into the room. Incredibly, you can see
    that the space behind the fire has opened up into some kind of passageway.
    <br><br>
    You barely have time to scratch a quick note to your foster-family, “Gone to Lionworts, not sure I’ll be back
    soon... or ever!” toss aside your copy of My Time with the Herds..., and step into the glowing silver flames that
    dance in the hearth.
  exits:
  - roomId: "lionworts:2"
    leaveMessage: "You step into the silver flames"
    direction: forward
  doors:
  - "lionworts:1":
    locked: false
    closed: false
- id: 2
  title: SPACE AND TIME
  description: >-
    What have you done, young Cub?! You are falling! Head over tail! You are completely disoriented, and seem to be
    plummeting for longer than would seem possible. You can’t tell what is up or down as you tumble through space and
    time, but you think you catch glimpses of treetops and rooftops, lightning and stars, gleaming lights and wet clouds
    swirling all around you. Wind roars in your ears, but you also hear the sound of feathered wings flapping, and
    hooves on cobblestones, and a deep unsettling laughter... until suddenly you land with a hard, wet thud.
  exits:
  - roomId: "lionworts:3"
    leaveMessage: "You land with a thud"
    direction: forward
- id: 3
  title: THE CLEARING
  description: >-
    You are in a muddy clearing in a dark forest, dense pine trees rising all around you. You hear the hushed sound of
    rain in the trees. A lonely owl hoots deep in the woods, but otherwise, you are completely

    alone. This forest is unfamiliar to you; even the scent of pine needles and wet earth seem strange here. You must be
    many miles away from Liondon indeed. In fact, this is quite possibly the farthest away from home you have ever been
    in your young life. Shaking off the rain from your fur, you take in your surroundings.

    To your [left] you see a strange stone obelisk.

    To your [right] is a dark pond.

    Directly in front of you is a stone path leading deeper into the woods.
  exits:
  - roomId: "lionworts:4"
    leaveMessage: "You approach the stone obelisk"
    direction: left
  - roomId: "lionworts:5"
    leaveMessage: "You head to the dark pond"
    direction: right
  - roomId: "lionworts:6"
    leaveMessage: "You follow the stone path"
    direction: front
- id: 4
  title: THE FROG-ELISK
  description: >-
    You approach the tall stone monument with curiosity and wonder. The rough stone is blackened from rain. Towering
    overhead at the top of the column squats a large stone frog.

    Wrapped around the base of the column are three stone tadpoles.

    You sense a strange energy emanating from the column in front of you, though it stands imposing and silent.

    LOOK - FROG: The statue atop the monument is well out of your reach, but you can see that its heavy- lidded eyes
    glitter dully in the dark; they are in fact large green jewels. The mouth of the frog is frozen open in a wide,
    impassive smile.

    LOOK - TADPOLES: The three tadpoles wrap themselves around the base of the monument, as if swimming single-file in a
    circle. Their mouths are open wide, as if croaking to their frog mother above. Upon closer inspection, it appears
    that there is a silver line traced around the inside of each of their mouths.

    USE - PITCHER (ITEM): You carefully pour the muddy water from the pitcher into the upturned mouths of the tadpoles
    at the bottom of the frog-elisk. As the last dribble falls into the third yawning tadpole, a long low croooooak
    begins to rumble down from above.

    You look up to see a strange green glow gleaming from the frog’s jeweled eyes.

    The mouth suddenly widens, and a deep feminine froggy voice echoes down from the statue:

    “Fur and scales, mud and smoke,

    Toads with manes and cubs that croak! Frogs and lions friends in rhyme,

    Across the realm and throughout all time.”

    The stone frog’s strange chant concludes, and with a tremendous burp!, she belches up a toad-shaped TOAD KEY (ITEM)
    that lands with a wet splat in the mud at your paws.

    LOOK: TOAD KEY (ITEM): The burped-up TOAD KEY is a made of heavy black iron and resembles the frog statue above you,
    complete with two small green gems for eyes. Along its protracted tongue are dozens of grooves and bits to fit a
    large metal lock.

    To return to the clearing, turn [back].

  exits:
  - roomId: "lionworts:3"
    leaveMessage: "You return to the clearing"
    direction: back
- id: 5
  title: THE POND
  description: >-
    Your paws squish in the mud as you make your way closer to the dark pond. A cold wind hisses in the dry cattails
    somewhere across the water. The air is thick with the wet scent of rotting vegetation.

    Though the place seems terribly lonely, it’s clear that someone has spent some time by the water’s edge: in a muddy
    space cleared out from the tall reeds, a stone plaque rises out of the soggy earth, beside which sits a pewter
    pitcher, half-submerged in the pond muck.

    LOOK - PLAQUE: You wipe the wet sludge from the surface of the plaque with your paw and discover a poem engraved in
    the bronze front-plate.

    “Muddy water, toad’s delight; thick with murk and stink. Clear rain falling from the sky, not dark enough to drink.”

    LOOK - PITCHER (ITEM): Half-submerged in the mud at the edge of the water is a heavy pewter pitcher. You are able to
    see an intricate engraving of singing frogs underneath the caked-on grime. Were it not for the filth that covers the
    metal, you would think this would be a very valuable keepsake for some frog- loving owner. Even more curiously,
    murky pond water inside the pitcher rises to exactly the level of a thin silver line engraved around the inner rim.

    To return to the clearing, turn [back].
  exits:
  - roomId: "lionworts:3"
    leaveMessage: "You return to the clearing"
    direction: back
- id: 6
  title: THE GATE OF MANY ANIMALS
  description: >-
    The path wends its way through the trees, and the wet stone is cold under your paws. Dead leaves and pine needles
    cover the ground, and thorny vines hang close from the branches overhead, blocking out the night sky and the rain.
    After a few minutes along the path, you reach a heavy iron gate that blocks your way.

    The gate looks ancient, as though it hasn’t been opened in years. Thick vines weave their way through the
    wrought-iron bars, bars cunningly shaped into the shapes of crows, toads, bats, newts, cats and owls. Some have
    little gold and silver nuggets for eyes, others clasp gems and pearls in their claws. At the center of the gate,
    beneath two large iron ravens, is an impressive black metal lion head.

    LOOK - LION HEAD: This iron Lion appears to be in the middle of an enormous but silent roar, and its two ruby eyes
    glitter fearsomely in the low light. In one nostril, you see a small keyhole.

    USE - TOAD KEY (ITEM): With trembling paws, you insert the toad-shaped key into the keyhole in the Lion’s nostril. A
    low growl emanates from the iron Lion head, and a heavy ka-chunk sound follows from the gate. As if in response, you
    hear a cacophony of crows squawking and a night owl screeching far off in the woods ahead. The gate whines as it
    creeps open, and the stone path continues into the rainy forest.

    To return to clearing, turn [back].

    To proceed along the path (once unlocked), go [forward].
  exits: 
  - roomId: "lionworts:3"
    leaveMessage: "You return to the clearing"
    direction: back
  - roomId: "lionworts:7"
    leaveMessage: "You proceed along the path"
    direction: forward
- id: 7
  title: THE PATH
  description: >-
    The stone path leads further into the dark forest. You take a deep breath, catching the smells of wet bark and pine.
    You hear the hooting of an owl deeper in the trees. Was this the same owl that delivered your invitation?

    The way forward is dark, and you can’t quite tell if the chill on your spine is from excitement or dread. To return
    to the Gate of Many Animals, go [back].

    To head east along the path, say [east].
  exits:
  - roomId: "lionworts:8"
    direction: east
    leaveMessage: "You proceed along the path"
  - roomId: "lionworts:6"
    direction: back
    leaveMessage: "You go back to the gate"
- id: 8
  title: THE PATH CONTINUES
  description: >-
    A chilly wind blows and shakes rain and dead leaves down from the branches that hang over the path. You shiver and
    try puffing up your coat to stay warm, but your wet fur clings to your cold, skinny frame instead.

    Your approach along the path startles a conspiracy of ravens out of the treetops above. They flap off, cawing
    hoarsely in irritation as they fly deeper into the dark woods.

    As the birds disappear, the forest feels eerily lonely, with no sound around you but the steady rainfall on the
    trees.

    To head west along the path, turn to 7. To head east along the path, turn to 9. —
- id: 9
  title: THE FALLEN TREE
  description: >-
    A very large and very dead oak tree has fallen across the stone path. Through the gap in the forest canopy, you see
    low rain clouds flash with pale sheet lightning.

    The ancient trunk is now covered in lichen and fungi. In the crook of one of the branches is a small hollow. On
    another branch, you see curious, sharp-angled scratches in the bark. Someone has carved crude symbols in the wood in
    a language you cannot read. When lightning suddenly illuminates the tree in front of you again, the symbols seem to
    shimmer with silver.

    Somewhat unsettlingly, you hear from deep within the forest ahead the rhythmic sound of clacking wood.

    You take a moment to give the tree trunk a few claw-sharpening scratches of your own to sharpen your claws and calm
    your rising anxiety.

    (NOTE TO DEVELOPER: Any time a Lion is magically ejected from Lionworts, or encounters a threat they can’t run from,
    they will appear here, and will need to progress through the game to return.)

    LOOK - SYMBOLS: You wait for the next flash of lightning overhead and watch as the silver etchings shimmer again.
    They seem to be some kind of magical runes, inlaid with silver in the bark itself. You wonder if it’s a warning for
    some better-versed Lion than you.

    LOOK - HOLLOW: It appears that this hollow was at one time a nest of some forest vermin, but has been long-abandoned
    by whatever animal took refuge in it. Inside, you see a cluster of leaves, some half-eaten acorns, and a tarnished
    GOLD COIN (ITEM).

    LOOK - GOLD COIN (ITEM): This tarnished gold coin has the bust of a regal-looking billy goat, but no lettering or
    denomination that you can determine.

    USE - CROW EYE: You carefully strap the crow’s eye over your own and gaze out through the shimmering black lens.
    Immediately the world is transformed. Colors you never could have imagined before shimmer into focus throughout the
    darkness. Were you the most gifted poet in Liondon, you would not have words to describe the iridescent blues and
    silver hues you see traced throughout the pathway and the trees around you.

    Your new sight catches the gleam of the runes scratched onto the trunk of the tree. You think you can finally make
    sense of the letters:

    “...for the coven and the good.”

    To return west along the path, turn to 7.

    To proceed further east along the path, turn to 10.
- id: 10
  title: THE SIGNPOST
  description: >-
    The path leads down into a small, low dell, overhung with enormous branches and carpeted with orange and yellow
    leaves. It is quiet here but for the patter of rain on the trees.

    Up ahead, you see a strange wooden guidepost where the path splits off in two different directions. The post's arms
    are two small tree branches, each pointing down a separate path. On top of each branch perches a weather-worn,
    wooden bird.

    On the left branch is a large and regal owl carved of pale beechwood, its wing raised and pointing to the north. On
    the right branch is a lean crow carved of sleek blackwood, its wing raised and pointing due east.

    Despite the fact that they appear to be inanimate wood carvings, you have the unnerving feeling that they are
    watching you.

    LOOK - OWL: The owl carving is beautiful and intricately detailed with feathers. The large talons on the branch look
    very sharp and very very real. The owl’s enormous round eyes are painted gold, and they shimmer in the rain.

    LOOK - CROW: The blackwood crow is stern, and seems to study you with a sharp judgment. There is one small, black
    obsidian stone that serves as the statue’s left eye. The right stone is missing.

    To take the Path of the Owl north, turn to 11. To take the Path of the Crow east, turn to 12. —
- id: 11
  title: THE PATH OF THE OWL
  description: >-
    The path follows an incline up the side of a low hill. Brambles cover the uneven stones and you must use all four
    paws to steady yourself on the steep and wet terrain.

    The rain is heavy, you are cold, and you’re starting to wonder if this adventure was really the best way to spend
    your evening. The excitement of your admission to Lionworts, however, and the possibility of getting in out of the
    rain, urge you forward.

    To the north, a narrow, muddy trail wends its way up to the hill crest. To follow it, turn to 13.

    To the east, the stone path continues into the trees and down the other side of the hill. To follow it, turn to 14.
- id: 12
  title: THE PATH OF THE CROW
  description: >-
    The Path of the Crow narrows as it leads deeper into the woods. The black branches above you and the brambles that
    grow about the tree trunks below shut out the sounds of the falling rain. It feels dark and oppressive on this
    pathway.

    As you venture deeper into the tunnel, the thorny brambles catch your fur and scratch you. To the east, the path
    opens into a clearing. To go to the clearing, turn to 27.

    To return to the signpost, turn to 10.
- id: 13
  title: THE CAULDRON
  description: >-
    You scramble on the muddy track, tree roots often serving as your steps. Perhaps you can get a better view of the
    surrounding terrain up here.

    You emerge into a small clearing on the hilltop. You are above the tree line here, but in the rain and the darkness,
    you can’t see very far into the distance.

    Further into the clearing you see a sturdy three-post wooden lean-to, from which a very large metal cauldron hangs
    suspended by iron chains. Beneath it is a smoldering campfire. Though the clearing is empty, you can tell that
    someone was here not that long ago. Beside a tree stump you catch sight of a leather-bound tome.

    Suddenly you hear the screeching of a night owl. Your nerves are a little on edge, but you think it sounds like a
    warning. But whom is it trying to alert?

    LOOK CAULDRON: You cautiously make your way to the campfire. An unusual herbal broth bubbles in the cauldron depths,
    and you notice sweet tubers, acorns, rhizomes, and tree bark simmering on the boil. Someone is clearly making the
    base of a meat stew, but what animal would fit in a cauldron this large?

    LOOK TOME: The tome is weather-worn and apparently well-used; its leather is cracked and spotted from the elements
    and cooking grease. You can only make out a portion of the title under all the stains: The Joy of Cooking: 101
    Recipes for Irresistible Feline[here the writing is illegible].

    Strange.

    To the west, you see a faint track leading into the dense underbrush. To follow it, turn to 15.

    To the north of you is a rocky overlook. To investigate it, turn to 17.

    To the south is the path back down the hill. To follow it and return to the Path of the Owl, turn to 14. —
- id: 14
  title: THE PATH OF THE OWL, CONTINUED
  description: >-
    The stone path continues its way through the forest, and the rain continues to fall in the darkness. Even with your
    keen feline eyes, you have difficulty seeing the way forward... but you have the unmistakable sensation that you are
    being watched.

    Thick ground mist now obscures the pathway forward and you are surrounded by tall evergreen trees, and you realize
    that the path here splits into two different directions. There is no signpost to guide you, but you can hear the
    sound of a stream up ahead, and the tinny clanging of metal deeper in the woods.

    To return west back up the hill, turn to 11.

    To head east toward the stream, turn to 18.

    To follow the sound of clanging metal south, turn to 19. —
- id: 15
  title: THE UNDERBRUSH TRACK
  description: >-
    The underbrush is so dense you no longer feel rain dripping on your head, but within moments the air is oppressive
    and warm. You notice a long rut in the ground in front of you, as if something heavy had been dragged along the
    track.

    Your nose also catches the musky scent of boar.

    Boar has long been a special, holiday feast meat for Lions; perhaps whomever set up the campfire is hunting boar in
    these hills? At night? In the rain?

    The underbrush track continues into the brambles, and you think you hear a kind of high-pitched whining and grunting
    in the darkness up ahead.

    Look, if I can be an honest narrator for you, something seems very wrong about this entire endeavor. To return to
    the clearing, turn to 13.

    To proceed through the underbrush, turn to 16.
- id: 16
  title: THE WERE-BOAR HOVEL
  description: >-
    You emerge from the underbrush into a dark and shallow den of dry branches and low beds of dead leaves.

    Your eyes adjust quickly to the near-complete darkness and you see a sounder of baby boarlets in one corner of the
    den. They notice your presence and erupt in a cacophony of panicked squealing, bounding around the hovel in terror.

    Your attention, however, is squarely on the enormous creature in front of you. It has the body and mane of a giant
    Lion, but the head of a mean old boar, with razor sharp tusks curling out like swords from the sides of its snout.

    It bellows a monstrous, menacing chuff and rises to its full height, towering over you in the bramble den.

    “I... I...” you stammer, but abject horror clouds your mind completely. You attempt to turn and run, but the
    creature bounds powerfully toward you with terrifying speed.

    Oh, naive Cubling, I tried to warn you, but you have stumbled into the den of a fearsome were-boar, and your quick
    wits and reflexes are no match for this infernal beast.

    Incongruously, the last sound you hear in this den of regret is the screeching of a night owl in the woods somewhere
    beyond the thorny walls.

    (NOTE TO SWIFTWOL: Here we can return the player to “9. THE FALLEN TREE”)
- id: 17
  title: THE OVERLOOK
  description: >-
    You clamber up several large rain-soaked rocks to the overlook and peer out into the void beyond the edge. It is
    difficult to see very far in the rain until a flash of pale purple sheet lightning reveals a vast, forested river
    valley below.

    You see no sign of any structure that could resemble Lionworts, just endless dark forest and rain.

    The empty landscape fills you with an aching loneliness and you begin to wonder if you will ever return to see your
    home in Liondon again.

    You are starting to lose yourself in melancholy when a second flash of lightning illuminates the sky and you catch
    sight of a large winged thing wheeling on the wind far off over the river. The sky is dark again before you can
    identify the creature, but your instincts scream at you to hide from its searching gaze.

    To return to the clearing, turn to 13.
- id: 18
  title: THE BRIDGE
  description: >-
    The stone path leads you down an embankment where the sound of rushing water grows louder with every pawstep. At the
    bottom of the slope is a narrow stone and wooden bridge that spans a fast-moving stream, obscured by fine mist.

    The bridge looks very old. Thick vines creep between its stone footings and rotting wooden planks cover large gaps
    in the span. The stream churns against mist-hidden rocks and through banks of dead reeds. Rain continues to fall in
    a steady, heavy patter on the trees, on the stone path and on the water.

    At the entrance of the small bridge, on the low parapet wall, stands a small, moss-covered statue of a Lion, its paw
    resting on an upright shield.

    Your whiskers twitch at the sense that something unseen is watching you from the darkness.


    LOOK - WATER: The stream runs swift and dark, swollen by the rain. It is almost entirely occluded in mist. As you
    listen, you think you can almost hear a sad, plaintive whisper through the gurgling of the current.

    LOOK - STONES/BRIDGE: The bridge looks quite ancient and not entirely trustworthy. Wooden planks lay rotting over
    gaps where the roadway and other stones collapsed into the water below. You wonder just how supportive those wet
    boards are now.

    LOOK - STATUE/LION/SHIELD: You are startled to see that carved into the Lion’s shield are gleaming silver runes
    you’ve noticed elsewhere on your journey. This time, however oddly, you think you can make sense of their meaning:

    “Cross the bridge, but pay the toll,

    Coins for the water, or bones for the troll.”

    You find yourself very unsettled, not only by your sudden, new-found rune-reading skills, but also by the
    information they’ve gleaned.

    USE - GOLD COIN: You toss a coin into the rushing water beneath the bridge and offer a silent wish to find your way
    safely to Lionworts. As if in answer to your thoughts, you hear the melodious sound of a

     wooden wind chime in the woods on the other side of the bridge. You also hear what sounds like a displeased grumble from the darkness beneath the stone span. (THIS UNLOCKS THE PATH FORWARD)
    The stone path continues over the bridge, and disappears into the dripping trees (LOCKED UNTIL “USE - GOLD COIN” ON
    BRIDGE). To cross the bridge and head east, turn to 40.

    On the north side of the bridge, you see a few broken stone steps leading down to some kind of landing under the
    bridge. To follow those steps under the bridge, turn to 21.

    A muddy track leads off south along the stream. To follow it, turn to 23. —
- id: 19
  title: THE FOUNDRY YARD
  description: >-
    In a clearing encircled by tall evergreens trees stands a small stone foundry. Tendrils of woodsmoke slink out of
    the chimney and into the rain and mist. From the open arches of the windows, the low red glow of firelight spills
    out onto the yard.

    Scattered in the wet grass are pieces of metalwork in various states of repair: some wrought iron gating, a large,
    cracked bronze bell, and a breastplate from an ancient suit of armor. Large clay cisterns collect the rainwater that
    splashes from the gutters.

    You see a creature at work in the building, backlit by the red light of a brick furnace.

    LOOK WROUGHT-IRON GATING: You run your paw over the cold, wet ironwork; it looks and feels not unlike the gate you
    encountered at the entrance of the forest. This section, however, depicts several large wolves giving chase to a
    small fox. Though seemingly in danger, the fox appears to be laughing as he holds three enameled roses, one red, one
    white, and one black, in his sharp teeth.

    LOOK LARGE BELL: This enormous bronze tower bell is riven from lip to crown. Whatever force caused the metal such
    injury must have been tremendous. Across the surface is an embossed image of a sun showering rays down on a forest
    and castle. Around the inscription band you see a curious poem:

    “My sister sings when few can hear, I sing when many can.

    Her song is silent, calm and clear Mine, brazen, brash and grand.

    I beacon forth the gold of day She, silver shining night.

    When trav’lers lose their day-lit way Three peals guide shadows right.”

    LOOK BREASTPLATE: You marvel at the craftsmanship of this beautiful piece of armor and wonder at the size of
    whatever Lion wore it into battle. It is certainly too large for you, and heavy, but you take a moment to trace a
    claw along the delicate inlay of a large silver tree in bloom and the many colored jewels that represent its fruit.
    This breastplate is one fit for an emperor: a gorgeous, priceless, and wildly impractical armament.

    A stone path overgrown with thorny shrubs leads into the woods to the west. To follow it, turn to 38.

     To explore the foundry, turn to 20.
    To return to the Path of the Owl, turn to 14.
- id: 20
  title: THE FOUNDRY FORGE
  description: >-
    You cautiously make your way up to the door of the foundry to see a large forest badger in a leather apron wielding
    a hammer and tongs at an anvil. He doesn’t notice you, so wrapped in his work as he is.

    “Um, excuse me? Mr. Badger?” you begin.

    “Harrum?” it barks in surprise, its furry arm raised mid-swing. “I’m, uh, so sorry to disturb you-” you stammer out.

    The badger whips around to face you.

    “Whut’s this, a Cubling, is it?” He is evidently baffled by your presence. He studies you with small black eyes that
    reflect the light from the furnace. “A bit late at night to be warnderin’ round in these woods, innit? Must be very
    brave, or very very stupid...”

    “I... uh, received a letter?”

    The badger doesn’t seem to quite understand your presence, but quickly seems to gauge your harmlessness.

    “Well, come in, come in, let’s get you outta this rain,” he grunts. He looks warily out into the woods as you cross
    the threshold, as if worried about something other than the weather.

    “Did anyone follow you, Cubling?”

    “Uh... no, no, I don’t know. I don’t think so. Why?”

    “Harrum...” he growls to himself as he guides you to a stool by the fire, casting worried glances out the door.
    “Harrum... most unusual, most strange...”

    You sit as he closes the door behind you.

    “I’m trying to get to Lionworts,” you start to explain, but the badger erupts in laughter, a surprisingly high-
    pitched chirrup.

    “Oh... OH! Well of course you are!” He exclaims. “Why else on earth would a Cubling be roamin’ ‘bout in these woods
    at night?” He growls a harrum to regain his composure.

    “But for the life o’ me,” he continues, “I canna tell why you’re here now?”

    He watches you intently as you tell him about your adventures so far: receiving the mysterious letter by owl,

    the invitation to tonight’s Orientation, and solving the riddle of the Gate of Many Animals.

    “Ohhh,” he grins to himself and nods. “So you liked that one, did ya?” He waddles to the furnace, and lights himself
    a pipe with one of the glowing embers. “Was my Gate, that. Some of my finest handiwork, if you’ll allow me to
    boast.”

     You’ve never known a badger not to boast when given the opportunity.
    “That was yours? It was a very beautiful,” you flatter before asking what’s really on your mind.

    “Are you...” you hesitate before lowering your voice, “a wizard?”

    The badger erupts once more in his chirruping laugh.

    “AM I A WIZARD?!” He squeals out. “Am I a wizard, he asks me!”

    You don’t really see what’s so silly about this question; he is a talking badger in a magical forest, after all.

    “LORDS NO, I’M NOT A WIZARD, CUBLING!”

    He continues to laugh at your question, but then sharply quiets himself, leaning in and lowering his voice.

    “But I knows my fair share of ‘em. Strange lot, they are...”

    He looks out through the window into the darkness beyond the foundry yard, and his concern returns.

    “I forged it, but it was Lions and Frogs that enchanted that Gate. Me, I’m just of service when they need a bit of
    metalwork they can’t manage themselves. Even with all their magicks.”

    As if on cue, the furnace fire blazes to life with a rush and a roar. The badger raises his brows.

    “My name’s Mr. Bartley, and you can call me ‘Mr. Bartley,’ and I’m one of the finest blacksmiths you’ll find in
    Liondon and out of it, I wager. My speciality is oracular and occult metals, right fine for wizardry, you see...”

    You’re starting to, you think.

    “But no. No, I’m not a wizard meself. Now listen, and listen well, Cubling. It’s high unusual you’re coming to
    Lionworts this late in the year. High unusual...”

    He draws on his pipe and thinks for a moment.

    “Maybe they lost some novices, and had you on the waitlist.”

    You attempt to look unruffled by this rather unsettling hypothesis.

    “Whatever it is,” Mr. Bartley continues, “there must be some extra-peculiar goings-on up that castle.”

    Your fur stands on end in excitement at the description of Lionworts as a castle. You’ve been wondering what it
    might look like, and how you might recognize it, and castles are inherently exciting places.

    “Now most unfort’nately, I can’t be of much service and take you there tonight. I’m bound here by my oath to the
    work.”

    “What is this place, exactly?” you ask.

    “Oh now see, this is a foundry,” he replies, “of the strictly peculiar variety.”

    He leans in with a conspiratorial gleam in his eye. “And I make the finest wands Lionworts has seen in nigh on a
    century.”

     You start at the thought of seeing a magic wand...
    “But those are reserved for your Fourth Year students, mind you. You won’t be gettin’ one of those any time

    soon. Assumin’ you survive that long.”

    You are excited and unsettled at the same time.

    “Also, high unusual no one was there to greet you at the path when you made it through the gate. That’s typical the
    only puzzle you have to solve, that. Harrum, harrum, don’t like that one bit...”

    He draws on his pipe and seems lost in thought for a moment.

    “I can only assume you’re being tested somehow, Cubling. But it’s a dangerous test, I’ll reckon.”

    “Can you tell me how to get to Lionworts, Mr. Bartley?”

    His eyes go wide at your question.

    “No, no, I’m afraid I can’t. But not because I don’t want to, Cubling, but because it doesn’t really matter what I
    tell you. If the path wants you to find Lionworts, you will. And if the path doesn’t... well, you won’t.”

    Mr. Bartley rises from his stool and takes another look out the foundry window at the rain.

    “But I’ll give you some advice. There’s things in these woods that are older than Lionworts. And stranger. And
    meaner. And you’d be best to avoid them, whatever you do. Use your mind, not your claws, and try to get to school on
    time.”

    Outside you hear that strange owl hooting again. The rain continues to drip from the slate roof of the foundry.

    “Will-o’-the-Wisps,” Mr. Bartley says. “Lost a lot of Second Year Cubs to Will-o’-the-Wisps a few semesters back.
    Terrible business. A few returned, but they were a bit... weird, after. You see those green lights out in the woods
    where there shouldn’t be green lights? You run. No pleases, no thank yous, just run.”

    He shuffles over to a small work bench on the others side of the anvil.

    “Now, I can’t be giving you a wand, Lords no, not allowed that, but this might come in useful to you nonetheless.”

    The kindly badger produces a small, star-shaped iron amulet on a chain.

    “What does it do?” you ask.

    “That’s the thing about oracular metals... it hasn’t found its use yet, but it just might in the right paws.”

    “Thank you!” You exclaim, “That’s very kind of you, Mr. Bartley.”

    “Thank me after you reach Lionworts, Cubling. I reckon you might not feel the same should you find yourself
    surrounded by were-boars or on a bridge troll’s dinner menu.”

    “Bridge trolls?!?” you exclaim.

    “Not that a bridge troll would understand the concept of a menu, mind you, or even a restaurant, least not one I
    want to have a reservation for. Just an expression.”

     You are now exceedingly unsettled.
    “But I’d best be gettin’ back to work. I don’t have much time. You seem like a decent enough Cubling. I do hope you
    make it in one piece, I really do...”

    Mr. Bartley turns back to the anvil, puts on his leather gloves, picks up his hammer, and like that, the
    conversation appears to be over.

    To return to the foundry yard, turn to 19.
- id: 21
  title: THE UNDER-BRIDGE STEPS
  description: >-
    You make your way down the slick stone steps toward the rushing stream and the underside of the bridge. The mist
    from the water curls in serpentine tendrils up the stream bank. It clings to the rustling reeds at the water’s edge
    and the stone pylons of the span. It swirls around your legs and is unusually cold.

    The steps and your paws become completely obscured by the fog and you have a difficult time picking your way
    forward. The stones are wet from the stream and the rain, and small driftwood branches under paw trip you with every
    step.

    As you make your cautious way down, your nostrils catch a powerful and rank odor emanating from the landing, or
    perhaps even from the stream itself.

    If you wish to continue to investigate the Landing, go to 22. If you wish to turn around, turn to 18.
- id: 22
  title: THE LANDING OF THE BRIDGE TROLL
  description: >-
    You stumble forward, tripping on the driftwood branches scattered on your path. You emerge from the low wall of fog
    and onto the stone landing directly below the first arch of the bridge.

    You realize several things all at once.

    You realize there is an enormous stone statue sitting on its haunches directly in front of you, facing the water.
    You realize that the troublesome driftwood branches under paw are actually old animal bones.

    You realize the enormous stone statue is not actually a statue, but a large and frighteningly ugly bridge troll.

    It turns its stoney head to you, and its eyes widen with hunger and menace.

    “I... I... I’m sorry to-” you bleat out, but the troll doesn’t understand you and he doesn’t care to try. With a
    shocking agility for a creature of his size and weight, the bridge troll throws a bone at you and lunges forward.

    You lash out with your claws and bare your fangs, and attempt to dive into the stream, but the bridge troll is
    possessed of supernatural speed and an enormous appetite. He catches you by the scruff of your neck like a kitten.

     The last sound you hear is the incongruous screech of a night owl in the fog on the other side of the archway.
    (NOTE TO SWIFTWOL: Here we return the player to “9. The Fallen Tree”)
- id: 23
  title: THE STREAM-SIDE TRACK
  description: >-
    The track follows the bank of the stream as it twists through the dark woods. The rushing water offers a constant
    roar beneath the patter of rain in the trees. The air is sharp with smell of pine sap and damp stone. You feel very
    lonely.

    The track is uneven and treacherous, occasionally washed out in places where the stream has risen to overwhelm the
    bank. You clamber over slick roots and fallen branches as you go.

    To the south is a small water mill. To investigate, turn to 24. To return north to the bridge, turn to 18.
- id: 24
  title: THE MILL OF RATS
  description: >-
    Downstream is a small waterfall. Next to it on the sloping bank stands an ancient-looking mill house, its stone
    facade covered in wet moss. Here, the stream gurgles and spills over the hulking black silhouette of a motionless
    wooden water wheel. You can hear the water splashing loudly over the oak paddles and onto the rocks below.

    The building looks like it’s been out of service for many years; the roof has largely collapsed, exposing large
    broken timbers to the elements, and one of the stone walls leans heavily into the structure. The water wheel remains
    intact, however, massive and solemn in the dark.

    Rain continues to fall and collect in large puddles in the cobblestone yard. Scattered around the yard are piles of
    frayed burlap sacks, a few wooden barrels, several broken, rotting, and fragrant pumpkin shells, and a disused
    flatbed horse cart.

    The mill appears to be completely abandoned, but your feline senses quickly tell you it is anything but: you catch
    the unmistakable scent of rats, and suddenly realize you are being watched by countless pairs of eyes from the
    building rafters and darkened windows.

    Ugh, you hate rats.

    LOOK - BURLAP: These sacks have been abandoned for a long time, and whatever grain they may have once held has long
    since been eaten by vermin or turned to rotten mush in this forest’s incessant rain. Upon closer inspection, you
    think you can make out faded stamps on the bags reading: “Pillet’s Millets,” and “Frote the Stoat’s Oats...”

     LOOK - BARRELS: Several large wooden barrels of questionable structural integrity stand by the door to the mill room, collecting the rain that spills down from the overhang. It appears that they’ve collected more than just water, though; in one of the barrels, you find a tarnished GOLD COIN (ITEM).
    LOOK - GOLD COIN (ITEM): This tarnished gold coin has the bust of a regal-looking billy goat, but no lettering or
    denomination that you can determine.

    LOOK - HORSE CART: This unyoked, four-wheeled cart stands faithful but lonely in the courtyard. It must have once
    been used to carry in reaped grain for milling, but now it merely collects rain and detritus from the mill rats. At
    the bottom of the cart box is a shallow pool of rain water in which float rotten pumpkin rinds and dead leaves.

    Your reflection looks back up at you from the rain-rippled surface of the p. Suddenly, a reflection in the water
    emerges of a dark and hooded figure leaning over the side of the cart across from you. When you look up with a gasp,
    you are startled to see that you are in fact alone.

    To enter the mill, turn to 25.

    To go to the water wheel, turn to 26.

    To return along the stream-side path, turn to
- id: 25
  title: THE MILLSTONE
  description: >-
    You step cautiously through the open doorway and into the darkness of the cold, damp millstone room. Immediately
    your senses are assaulted by the stench of rotten grain and rat dung, as well as the scurrying and squeaking of
    scores of rats that scatter at your approach. Your skin crawls and your fur stands on end in the presence of so many
    vermin.

    In front of you is an enormous, circular millstone that takes up most of the room. Beside it are wooden grain
    troughs from which the odor of rot emanates. When you glance above the millstone, you see countless tiny but
    malevolent red eyes studying you from the shadows of the rafters.

    You clear your throat in what you imagine is an assertive half-roar. “I’m not here to cause you any trouble,” you
    offer.

    Your attempt at begrudging magnanimity, however, is greeted with nothing but snickering squeaks. The rats are
    mocking you.

    LOOK - MILLSTONE: The massive circular stone at the center of the room once processed raw grain and ground it to
    flour. Upon closer inspection, you see that it is actually comprised of two large round stones stacked atop each
    other: a stationary nether stone on the bottom, and a rotating flying stone on top. Both are scored with innumerable
    grooves to allow grains to spill in from the hopper above and for flour to spill out the sides into wooden
    collection troughs below.

    You are studying at the intricate lattice of grooves on the wheel when you notice incredibly fine silver tracings
    around the entirety of the millstone. You are not a little unsettled by the rhyme you discover:

    “Circle bound and circle made,

     What’s sown is reaped, what’s owed is paid. To dust of grain and dust of bone,
    All will fall beneath the stone.”

    To go out the archway to the water wheel, turn to 26. To return to the mill courtyard, turn to 24.
- id: 26
  title: THE WATER WHEEL
  description: >-
    Carefully, you step onto the old oak platform. The boards are slick with algae and river water spray. Your nostrils
    fill with the smell of old wet wood.

    At one time, this enormous wheel caught the falling stream water on its paddles, and rotated an axle in the wall to
    move the heavy millstone in the other room. Now, the wheel is merely an enormous piece of furniture for the mill
    rats. Half of its buckets collect and spill water onto the rocks below, but the other half is stuffed with detritus
    collected by the rat colony. In fact, you see all kinds of loot the rats have stolen from around the forest; torn
    pages of books, a broken lantern, cutlery, seashells, and all types of debris.

    Most curiously, you catch sight of a crooked wooden and metal wand gleaming in a soggy pile of rags.

    LOOK - PAGES: Most of the paper the rats have used to nest has turned to wet mush in the rain, but in one of the
    wooden buckets, one torn sheet remains dry and intact. You are disturbed to see it’s a recipe for a most unsettling
    meal:

    “Autumnal Seasonal Cubling Stew: 20 pounds Cub meat, 5 dollops lard, 1 gallon red wine, lots of stock!, 5 pound of
    acorns, 10 pounds ground tubers, rhizomes if you got them, 1 pound pine bark, 4 fistfuls of oak leaves, 1 bush
    thyme, 20 whole cloves garlic, 10 bay leaves (if possible), 1 bunch rosemary leaves, quartered 5 large onions,
    roughly chopped, 20 carrots - peeled and roughly chopped, 10 celery ribs - roughly chopped, 5 cups tomato paste.
    Generous pinches ground nutmeg, pepper, and to make more savory, four whole salt licks.”

    LOOK - LANTERN: This broken lantern is caked in melted wax and soot. Jagged glass shards threaten your paws. You
    gingerly use a claw to open one of the latches, and see inscribed in the base of the wax candle:

    “Let all who walk in darkness see The shadows from this candle flee Let this faithful light burn bright And offer
    peace in darkest night.”

    LOOK - WAND (ITEM):

    This wand is perhaps the most remarkable thing you have ever seen in your young life, Cubling.

    It is about a paw and a half long. It is intricately crafted out of dark walnut wood, with a complex and gleaming
    silver inlay woven around the pommel and grip like ivy. Everywhere you look more closely, you see even more
    impressive detail work; tiny silver ivy leaves gleam along the shaft, and the wood grain itself swirls in
    innumerable, interwoven runes. Near the top of the wand, tiny silver thorns clutch a small, rough-hewn but
    shimmering black agate stone.

     Your heart races; is this an actual magic wand? Was this wand stored here for safe-keeping or did the rats steal it from its proper owner? What shall you do with this masterpiece of sorcery?
    (NOTE TO DEVELOPER: Until players discover a spell book, or we devise a system for magic, the USE wand command can
    send another player back to 9. The Fallen Tree from whatever room they are in. Maybe once out of every four or five
    times, the players accidentally sending themselves back to 9. The Fallen Tree?)

    To go into the mill, turn to 25.

    To return to the mill yard, turn to 24.
- id: 27
  title: THE PUMPKIN PATCH
  description: >-
    The path emerges from the woods into a small field, where you catch the sound of numerous blackbirds cawing in
    agitation.

    The rain has let up a little, thankfully. Throughout the field, you see numerous pumpkins-on-the-vine, some small
    and green, some large and misshapen by their own ripeness and weight. The sweet fragrance of pumpkin mash greets
    your nose; it appears that the crows have assailed one of the larger gourds, and are flapping around its spilled
    seeds and pulp.

    The clouds above part briefly, and in the faint moonlight that emerges, you catch a strange sight; at the far end of
    the field, a tall and unusually thin figure lopes slowly along in uneven movements. In its hand it carries a tall
    grain scythe.

    If you wish to run away from the unsettling figure and continue on the Path of the Crow, turn to 29. If you wish to
    approach the figure and possibly ask for directions to Lionworts, turn to 28.
- id: 28
  title: THE SCARECROW FIELD
  description: >-
    You trot forward to greet the figure at the wall.

    As you approach the thing, however, a dreadful chill floods your body and your fur stands on end.

    Caught in a brief moment of moonlight, the figure looks like an antelope standing on its hindquarters, wearing
    ragged overalls and a broad-brimmed hat through which its antlers curl in wicked spirals. But this creature, you
    realize, is made entirely of straw. Beneath the brim of its hat, you are stunned to see not a face, but an overripe
    pumpkin for a head. It carries a gleaming scythe, which it swings at the crows. They flap out of its way and caw
    loudly, squawk-mocking its attempts to shoo them away from their meal.

    Suddenly, the scarecrow antelope ceases its scuffle with the birds and slowly turns its pumpkin head to you. “Uh
    oh...” squawks one of the crows.

     You’ve been discovered.
    “Who are you and what do you want...?” It intones gravely.

    “Uh...um...I’m-I’m a bit lost, I’m trying to get to-” you stammer.

    “Have you come to steal from me too?”

    The birds caw in excited anticipation.

    “No! Not at all!” you blurt out, as it raises its scythe and strides unsteadily toward you. “I’m a Lion, I don’t
    even eat pum-”

    “I am the guardian of gourds, the protector of the patch, and I will defend the crop from all thieves, feathered and
    furred!”

    The blade of the scythe swings wildly through the air, startling several nearby crows into flight.

    You realize quickly that reason is lost on this single-minded creature.

    Though lacking the grace of a flesh-and-blood gazelle, it nonetheless moves with unnatural speed, and despite your
    feline reflexes, it bounds upon you. The cruel scythe slices the air just over your ears.

    The last sound you hear is the incongruous screeching of a night owl from somewhere far off beyond the pumpkins.

    (PLAYER IS HERE RETURNED TO 9. THE FALLEN TREE)
- id: 29
  title: THE PATH OF THE CROW, EAST WOODS
  description: >-
    You crash heedlessly through the thorny underbrush that tangles its way over the path. In the darkness, you narrowly
    avoid hitting your head several times on some low-hanging branches.

    You stop and assess. Ahead, the stone path emerges into a well-tended glade of low-cropped grass. To one side of
    you, a small track branches off and leads deeper into the woods. For a moment you think you see glimmers of faint
    green light far off in that direction, but when you rub your eyes with your paws, they are gone.

    To explore the small track, turn to 30.

    To return to the pumpkin patch, turn to 27.

    To continue on the stone path to the glade, turn to 32.
- id: 30
  title: THE BOG
  description: >-
    You follow the dirt track deeper into the woods. Soon the track is muddy and you are sidestepping large puddles of
    rainwater. Judging by the scent of rotting vegetation and the waterlogged roots of the trees around you, this track
    seems to lead down to a forest bog.

    Your progress on the track is getting slower and more tortuous, and your paws and legs are thoroughly caked in
    thick, smelly mud. You are seriously considering turning back, when suddenly you hear the faint call of a lioness’
    voice, far away, and in distress:

    “Hellllp!” she moans plaintively.

    Dread and sympathy rise in you in equal measure. You press on along the wet path.

    As if embodying your worry itself, there appears in front of you an apparition of faint, sickly green light,
    wavering steadily over a pool of murky water. The light reminds you of a low, undisturbed candle flame, or of slowly
    undulating tresses of long hair in a warm breeze.

    “Hellllp me, Cubling... I’m sinking...” calls the voice on the other side of the pool.

    You feel very scared and very conflicted; if you could just see through the hovering green light, maybe you can
    figure out how to help the lioness, but something feels very wrong about this place.

    To turn back to the path from whence you came, turn to 29.

    To see if you can help the strange voice on the other side of the pool, turn to 31.
- id: 31
  title: THE DARK POOL OF THE WILL-O’-THE-WISP
  description: >-
    The voice goes quiet as you look deeper into the light. You see a mirror image of yourself looking at you from the
    light, but grinning strangely. The green flame moves further out over the brackish water, and you feel drawn to it,
    mesmerized by its swaying movement.

    Your feline intuition is screaming at you that there is no damsel in distress, and that this will-o’-the-wisp is a
    malevolent specter attempting to lure you into the swamp.

    You realize it is a venture from which you might not return.

    You try to obey your instincts and flee, but it is too late. Thick, brackish mud clings to your paws, and you are
    sinking slowly into the bog.

    The more you panic and struggle, the more the mud swallows your paws. The green light sputters and offers only the
    sound of your own laughter echoing coldly at your predicament.

    As the water rises to your chest and neck, the last thing you hear is the incongruous screeching of a night owl over
    head.

    (PLAYER IS HERE RETURNED TO 9. THE FALLEN TREE)
- id: 32
  title: THE CHAPEL GROUNDS
  description: >-
    A chorus of crow-caws greets you as you emerge from the woods and into a grassy clearing. The rain has eased, but a
    thick fog now blankets the ground. In the middle of the glade stands a dark and dilapidated chapel building, its
    roof partially caved in.

    All around, you can see the silhouettes of dozens of blackbirds standing sentry on the low, broken stone wall that
    rings the glade, on the headstones in the cemetery behind the building, on the low ruins of the tumbled- down tower
    and in the cross-beams of the collapsed roof. The squawking is incessant.

    To follow the path down to the chapel, turn to 33.

    To follow the path around to gate of the cemetery, turn to 34.
- id: 33
  title: THE ROOKERY CHAPEL
  description: >-
    The chapel’s enormous and weathered oak doors hang ajar in their arched stone frame. In the dark of the rafters you
    hear hundreds of roosting crows, cooing, cawing, and shuffling in their numerous nests. The sound of their voices
    and wings echoes off the stone floor and columns.

    You prepare to introduce yourself to the birds. You clear your throat to speak, and they fall into a silence.
    Suddenly, they erupt in a cacophony of shocked caws and rustling feathers. In the echoing maelstrom of shrieks and
    flapping wings, you realize you hadn’t actually planned what to say.

    “Excuse me...” you attempt, but the birds are in a frenzy.

    “I’m so sorry!” you shout, “I didn’t mean to disturb your flock!”

    The birds fall into stunned silence.

    “What did you call us?” a deep, hoarse voice croaks down from the eaves of the chapel.

    “I... uh...”

    “WE, are not a ‘flock’...” the voice calls down from the darkness, its tone harsh with menace. “No, WE are not, no
    WE are not!” the birds echo throughout the chapel.

    “WE are a MURDER!” the leader squawks down.

    “MURDER! MURDER!” the crows all caw excitedly.

    Oh, Cub, what have you stumbled into?

    “I’m so sorry!” you try one more time. “Of course you are! And a very noble murder at that!” “MURDER!” The birds
    continue to caw.

     “I’m just trying to find my way to Lionworts. Have you heard of it?”
    There is another synchronized silence among the crows before they erupt with tremendous harsh laughter.

    “You’re a very long way from home, Cubling,” the voice intones. “And trespassing in a very sacred rookery.”

    Your fur begins to rise in anxiety.

    “Come up to the eaves and let the Murder decide what the Murder thinks. Do so, or the Murder will feast on Lion meat
    tonight.”

    You see a collapsed roof beam that leads up to the inky darkness, in which you see an enormous black crow with a
    single glittering eye.

    To proceed up the eaves, turn to 35.

    To make your escape back to the chapel grounds, turn to 32.
- id: 34
  title: THE CEMETERY
  description: >-
    The blackbirds caw at you and flap off as you approach the low and broken stone wall that rings the cemetery. You
    push open the iron gate with a tentative paw, and the ground mist swirls from the disturbance. The squealing hinges
    are unsettlingly loud, and you wonder to whom you’ve just loudly announced your presence.

    The cemetery is a small one, with not more than a few dozen ancient headstones and monuments scattered like broken
    teeth throughout the yard. Closest to you is a black headstone covered in lichen and a grey headstone covered in
    cracks.

    Your keen feline eyes watch for movement deeper in the darkness, but you see only the low mist that drifts on the
    ground and blackbirds hopping farther off in the distance.

    LOOK - BLACK HEADSTONE: You look closely at the small, black, lichen-covered headstone closest to you. It is very
    old and weathered, topped with a simple granite statue of a blackbird.

    On the surface of the headstone is chiseled the outline of a single wing, and a curious memorial:

    “Here lies the wing of a one-winged rook

    Who told a scurrilous tale with no more than a look,

    He wagered for baubles, but lost to a crook,

    Who took its black feathers and here left it be-plooked.”

    You are pondering this strange rhyme when you notice that the springy turf around the headstone has been recently
    disturbed.

    LOOK - GREY HEADSTONE: You look closely at the grey, cracked headstone. It is very old and has seen better days. It
    is topped with a simple granite statue of a blackbird. The epitaph inscribed in the stone reads:

    “Here lies a false crow, who fibbed with each caw

     He lied while he lived, he’ll lie evermore,
    His tales all were loathsome quite inconceiv’ble, So now he’s unmissed, and quite unbereavable.”

    You’re getting the sense these crows might only use headstones to make fun of each other.

    LOOK - WALL: The low slate and block stone wall looks as though it’s been here for centuries, tumbled- down and
    covered in brambles as it is. Upon closer inspection, you notice a small, pale rock wedged in with the others. When
    you prize it loose, a small GOLD COIN (ITEM) tumbles out.

    LOOK - GOLD COIN (ITEM): This tarnished gold coin has the bust of a regal-looking billy goat, but no lettering or
    denomination that you can determine.

    To return to the chapel yard, turn to 32.

    To leave the cemetery and follow the path into the west woods, turn to 37.
- id: 35
  title: THE EAVES
  description: >-
    You scratch your way up the broken roof beam into wooden eaves of the chapel. Your heart is pounding with
    trepidation. The blackbirds throughout the chapel chatter with judgment.

    “Murder, murder, murder...”

    At the top of the beam is a great nest of thin twigs, woven like wicker, and brimming with feathers and tattered
    book paper. The numerous black eyes of a brood of hatchlings study your arrival through the gaps in the twigs. On
    top of the basket nest sits the largest crow you have ever seen. He is almost the size of a raven, with a sleek
    black coat and an eyepatch over one eye. He studies you intensely before preening the underside of his enormous
    wing.

    “Do you know who I am?” the crow asks you casually, with a tone that suggests you really should.

    “Only that you are a very important bird, sir,” you attempt flatteringly. He snorts at your ingratiating response.

    “You are to call me, ‘Your Excellency,’” he replies, his beak still buried in his feathers. “And you wish to go to
    Lionworts?”

    “Yes, more than anything, Your Excellency!”

    The birds squawk below.

    “And you have your letter of admission as proof?” he asks.

    “Uh... no. It sort of... burned up.”

    The giant crow whips his head to you and studies you again with his one black eye. “SUSPICIOUSSSsss...” he hisses.

     “Murder, murder, murder...” the crows throughout the chapel mutter.
    “Honest!” you cry. “I was at home, and an owl delivered it, and when I read it, it burned up in silver flames!” At
    the mention of the owl, the crows shriek in distress.

    “Owl-friend! Owl-friend! Owl-friend!”

    “NO FRIEND OF THE OWL IS A FRIEND OF THE CROW!” His Excellency screeches.

    You want to slap yourself in the head for your succession of faux paws, but you continue nonetheless.

    “It was sent by Llewellyn Bonisagus, the Lionworts Dean of Admissions and Wizard of the Nineteenth Order (ret.)! He
    invited me! I jumped through a fireplace to get here! But now I’m lost! I don’t mean you any harm! I promise!”

    The echoing squawks all around you have reached a fever-pitch. The giant crow ponders for a moment.

    “SILENCE!” he caws to his murder. They settle quickly. “Yesss, yes. I know this wizard. Your story sounds
    preposterous, but perhaps...” he trails off in thought. “Perhaps the Cubling is exactly what I need...” he coos to
    himself. Finally, he calls to the rest of the chapel.

    “I have decided!”

    “The Murder has decided!” the crows reply.

    “I will allow you to leave, on one condition! You find the Magician Llewellyn Bonisagus, and remind him of his
    promise to find and return... MY EYE!”

    The birds chatter excitedly, “Allow Cub to leave... allow Cub to leave... find the EYE... find the EYE...”

    “Yes, Your Excellency. I will assist you in any way I can,” you offer hopefully, with one look to the beam from

    which you came.

    “It is now time for you to leave the eave.”

    His Excellency turns his attention to the broken stained glass window behind you, through which you can see the wall
    of the foggy chapel cemetery below. “That way.”

    He watches you sternly with his one black eye.

    “Go on,” he croaks wickedly. “Defenestrate yourself.” To exit through the window, turn to 36.
- id: 36
  title: THE STAINED GLASS WINDOW
  description: >-
    With the chattering of the crows echoing throughout the chapel, you gingerly make your way to the edge of the
    enormous and broken stained-glass window.

     Rain dribbles in through the gaps, and jagged glass and lead cames make for a dangerous exit. You barely avoid cutting your paws on the sharp detritus, gracefully reaching the rain-slick ledge on the exterior of the chapel.
    LOOK - WINDOW: For a brief moment, moonlight breaks through the rainclouds and illuminates what must have once been
    a beautiful and ornate stained glass window. What remains shows only the feet and paws of several kinds of animals,
    and a banner with the words “In our solemnest covenant...”

    To shimmy down the buttress and into the cemetery, turn to 34.
- id: 37
  title: THE PATH OF THE CROW, WEST WOODS
  description: >-
    The ground mist has almost completely obscured the path, but you press on slowly, feeling your way forward by the
    wet stone beneath the pads of your paws.

    Deep in the mist and the dark trees, the sound of clanking metal and scent of woodsmoke drift among the mist in the
    chill night air.

    Unfortunately, it’s not long before rain is falling openly on your head again, and you are very cold. What you
    wouldn’t give for a bowl of warm antelope stew right now.

    You notice that a narrow trail that splits off from the path and leads into a thorny wall of undergrowth. To travel
    north on Path of the Crow, turn to 19.

    To travel south on the Path of the Crow, turn to 34.

    To turn onto the thorny way, turn to 38.
- id: 38
  title: THE THORNY WAY
  description: >-
    You enter the tunnel of thorny brambles and make very slow going. It is smaller than is comfortable, and before
    long, your head and shoulders are nicked and bleeding from numerous scratches.

    To travel east to the Path of the Crow, turn to 37. To travel west into the brambles, turn to 39.
- id: 39
  title: THE THORNBUSH GATE
  description: >-
    You emerge from the thorns into a small gap in the brambles. Black wrought-iron posts jut out of the underbrush on
    either side of you. You surmise that at one time, there may have been a metal fence barring

     the way forward, but now there’s merely a double gate of cunningly woven thorn bushes. They even appear to swing on wooden hinges like doors. Given your recent experience with thorns, they might be just as imposing a barrier to entry as a spiked metal fence.
    LOOK - GATE:

    To push open the gate and go south, turn to 40.

    To return to the Thorny Way and the Path of the Crow, turn to 38.
- id: 40
  title: THE THORNBUSH MAZE
  description: >-
    You are on an open-air path. Rain drizzles down from the dark sky above. All around you are tall and wildly
    ill-kempt thornbush hedges. The thorny gate is soundly locked.

    You are in a topiary maze of thorns. The dense and overgrown walls make it difficult to see far ahead, though you
    are at a junction in the bushes.

    If you wish to head west, turn to 41. If you wish to head east, turn to 42. If you wish to head south, turn to 43.
- id: 41
  title: THE URN
  description: >-
    You push your way along the narrow path, nicking your paws and nose on the countless thorns. After a moment, the
    space widens again, and you see a small alcove in which stands a large, black marble urn standing on a white stone
    plinth.

    LOOK -URN: The urn is beautiful and of impressive craftsmanship, but unsettlingly large and ominous. Pale veins run
    throughout the polished marble surface, and the drizzle gives it a radiant sheen.

    Debossed in gold lettering across the marble crown of the urn are the words “vita fugit, sicut umbra.” If you wish
    to head west, turn to 45.

    If you wish to head east, turn to 40.
- id: 42
  title: THE PUDDLE
  description: >-
    The path continues for long wet way, until you find yourself walking in a large rain puddle. The water is quite cold
    around your paws, but unavoidable, extending as it does to each of the thorny walls.

    LOOK - PUDDLE: You look down, and the reflection the puddle offers you in return is very strange. You see yourself,
    standing alone in the thorn maze, just as you are. Instead of rainclouds overhead, however, you see a vast field of
    gleaming stars. The image is entrancing and very beautiful, and you find yourself lost for a moment in the
    magnificent celestial display.

    After a moment, however, you begin to notice a strange black shape wheeling through the night sky and blotting out
    the starlight. You sense that whatever it is, it is searching for you. You also sense that you do not want to be
    found.

    With a shudder, you look up and are relieved to see only dark storm clouds and falling rain overhead. If you wish to
    head west, turn to 40.

    If you wish to head south, turn to 47.
- id: 43
  title: THE BOWER OF CHIMES
  description: >-
    The thorny walls widen and you find yourself in a small garden, though it is dead and fallow this late in the year.
    Out of the hedge walls grow vine trellises, their branches woven together to form an arched bower overhead.

    Hanging from the dead vines are dozens of wooden chimes that clack and clatter in the cold wind. Their sound rises
    and falls in uneven rhythms, and you have the fanciful notion that the chimes are warning you of something.

    To head north, turn to 40.

    If you wish to go west, turn to 44.
- id: 44
  title: THE MIRROR
  description: >-
    The path opens into dead end space paved with irregular slate stones. Set in the far wall of thorns is an enormous
    black glass mirror, held by an ornate frame of peeling black wood and gold-leaf.

    LOOK - MIRROR: O, Cubling. What strange wonders hath fortune wrought for you this night?

    You gaze into the depths of the mirror, but it is a moment before your reflection comes into focus in the

    dark glass. What you see there transfixes you utterly.

    Your reflection stands looking out from the mirror, but it is no longer a Cub. Instead, you see an adult Lion,
    shrouded in heavy dark robes and holding a staff. It is unmistakably you, but much older. Your face looks heavy with
    grief, but softens into wonder upon seeing you in your present younger form.

     Younger Cub and older Lion study each other for a moment, amazed.
    Suddenly, your reflection telling you something, frantically, but no sound emanates from the glass. You shake your
    head to tell your reflection you cannot hear.

    You watch the Lion’s mouth and their elaborate, desperate gestures. You think you can make out a few words: “speak,”
    “four,” “poem,” and “door.” You’re trying to makes sense of these words when you catch sight of something that fills
    you with abject horror; a sinister shape is moving unseen toward your reflection, a large slithering thing in the
    darkness. You point and shout for your reflection to turn around and see the danger but it doesn’t seem to
    understand you.

    You realize quickly there is only one way to save your future self... you shout and spin around, forcing your
    reflection to do the same in the glass.

    Your heart pounds and your fur bristles. You gasp for breath. Were you too late? What happened to the older you?!

    Despite your desperation and confusion, you dare not turn to look back at the glass, lest you accidentally force the
    older Lion to turn its back on the dangers that await it in the future.

    You are left to try to make sense of the four words and why they seemed so important... You try to steady your
    nerves and continue.

    To return east, turn to 43.
- id: 45
  title: THE TAPESTRY
  description: >-
    You continue on the topiary path, drizzle hissing on branches all around you. Up ahead, you see a cloth tapestry
    hanging from a wooden frame in the thorn bushes.

    LOOK - TAPESTRY: The strange devotional is a marvelously woven and dyed cloth, depicting a unicorn sitting in a
    fenced yard, its neck leashed to a pomegranate tree by a gold chain.

    If you wish to head south, turn to 46. If you wish to head east, turn to 41.
- id: 46
  title: THE BLACK WOLF
  description: >-
    You push your way through the brambles on the path only to emerge to a terrifying sight. In front of you is the
    largest black wolf you have ever seen, its muscular form poised to strike and its enormous fangs bared in a silent
    snarl. The beast remains perfectly still and tense at your appearance. It takes you a moment to realize that the
    wolf is in fact a topiary sculpture, made entirely of cunningly woven black thorn bushes.

     LOOK - BLACK WOLF: The thorn wolf is many times your size and ferocious. Two large, dark glass spheres serve for its eyes, and though you can’t be sure, they seem to follow your movements. In the wolf’s bared fangs, you see a BLACK ROSE (ITEM).
    LOOK - BLACK ROSE: Upon closer inspection, you see that the rose’s stem is studded with innumerable tiny diamond
    shards, and the bud is crafted of black silk. The veins of the gentle petals are delicately filigreed in silver.

    If you wish to return north, turn to 45.
- id: 47
  title: O, THE DRUDGERY OF A THORNY, RAINY TOPIARY MAZE
  description: |-
    So many thorns. So much rain.
    You trudge along on the wet path and compose a ditty to yourself:
    “It’s all rain and thorns, or it’s all thorns and rain. It never gets better, it’s always the same.
    If you go forward or back where you came,
    It’s all rain and thorns or it’s all thorns and rain.”
    If you wish to head north, turn to 42. If you wish to head south, turn to 48.
- id: 48
  title: THE RING OF STAVES
  description: >-
    The path opens onto a grassy clearing where two paths bisect. Where the two paths cross each other, stands a circle
    of seven upright wooden staves, driven into the springy turf at various angles.

    You sense something very formal and ritualistic about the presence of the staves at this crossroads, and you find
    them inexplicably troubling.

    You elect not to walk through the center of the circle, but instead skirt around the staves by staying close to the
    thorny wall.

    If you wish to head to the north, turn to 47. If you wish to head to the south, turn to 49. If you wish to head to
    the east, turn to 56. If you wish to head to the west, turn to 50.
- id: 49
  title: THE BOTTLED WING
  description: >-
    The path dead ends in a hedge cul-de-sac. Set into the wall of dark thorns is a small arched alcove, is a weathered
    wooden shelf. Recessed in the wall and protected from the rain by the curling branches above it, stands a beautiful
    glass cloche bell jar.

    LOOK - BELL JAR: The glass is crystal clear and very thin, perched on a round, black wood stand.

    Inside the glass jar is a beautiful if haunting display. Set on a bed of moss and framed by black wooden stems is
    the skeletal wing of a large bird. The bones are bleached white and look terribly delicate. At the tip of the wing
    are three large iridescent black crow feathers.

    To head back north, turn to 48.
- id: 50
  title: THE DOGWOOD OF SPRING
  description: >-
    In the middle of the path stands a giant flowering dogwood tree, its branches blooming white even in the rainy
    darkness. The ground beneath is carpeted with beautiful fallen white petals and blossoms.

    You marvel for a moment at how the tree is blooming out of season; this vibrant and display would be more
    appropriate at the spring equinox, not in late October.

    Curious.

    If you wish to head west, turn to 51. If you wish to head east, turn to 48.
- id: 51
  title: THE BENCH AND THE BOOK
  description: >-
    The pathway leads to a quiet area of repose. A stone bench sits under a canvas canopy alongside one wall.

    Sitting on a tall lectern next to the bench is an open leather-bound book, pot of ink, and quill.

    LOOK - BENCH: The bench is a simple but sturdy stone bench. Upon one arm is carved: “In loving memory of Ermina
    Fink, who sat here long ago.” Upon the other arm is the carved: “In spiteful foreshadowing of Ervius Fink, who
    likely will never show.”

    LOOK - BOOK: You glance at the open page of the book and realize it’s a guest record. Upon closer inspection, you
    see a chilling sight: on line after line, on page after page, there is only one name written over and over again:
    “Ervius Fink.”

    How long was Ervius Fink trapped in this maze, you wonder... If you wish to head west, turn to 52.

     If you wish to head east, turn to 50. If you wish to head south, turn to 54.
- id: 52
  title: THE MOON DIAL
  description: >-
    You step into a small clearing and see a low dais, on which is affixed a large black marble moon dial. It shows
    remarkable craftsmanship, and is covered in swirling silver inlay and various symbols and numbers.

    Interwoven among the thorny walls of the clearing around you bloom countless white moonflowers and night lilies. The
    air is fragrant with their delicate perfume in the rain.

    LOOK - MOON DIAL: A thin silver spike rises in the center of the black clock face. On a clearer night than tonight,
    the moon would cast the needle’s shadow in a wide arc around the dial. The various arcs of silver traced along the
    surface each draw a different nightly path for the moon, depending on its waxing and waning cycle.

    Embossed on surface of the dial are also the words: “Dum tempus habemus operemur bonum. Mox nox.” If you wish to
- id: 53
  title: THE WHITE WOLF
  description: >-
    You push your way out of a bramble wall and into a ring of broken white marble pillars. In the center of the circle
    is an enormous white wolf, its back arched in an imposing threat, and its teeth bared in a wicked snarl. The wolf is
    a topiary statue, and though merely wrought of bleached holly and interwoven with pale thorny vines, it feels like
    it could strike out with terrific malice at any moment. The pale beast remains perfectly still and tense at your
    approach. A wind stirs in the clearing, and streams of pale cloth flutter from the wolf’s frame.

    LOOK - WHITE WOLF: This white thorn wolf is many times your size and ferocious. Two large, dark glass spheres serve
    for its eyes, and though you can’t be sure, they seem to follow your movements. In the wolf’s bared fangs, you see a
    WHITE ROSE (ITEM).

    LOOK - WHITE ROSE (ITEM): The rose’s stem is studded with innumerable tiny sapphire shards, and the bud is crafted
    of white silk. The veins of the petals are delicately filigreed in gold.
- id: 54
  title: THE SOUND THE RAIN MAKES
  description: >-
    The brambles part and you find you are in a quiet space where the path bends to the east. There are no noticeable
    landmarks or anything to make this area particularly unusual, but you stop and take it in nonetheless.

    You’re on a rainy path at night in a magical forest.

    Let’s think about that for a moment. Only a few hours ago, you were eating hot stew by the fireplace and trying to
    write a book report for your Antelopes Anatomy class. Now you’re on an adventure, and a rather sad and frustrating
    one at that. Not much you can do now but take it all in, be appreciative for the experience, and try not to get
    eaten by wicked creatures or succumb to ancient evil sorceries, you suppose.

    You listen to the sound of the rain on the brambles, a fine melancholy hiss, splatter and drip, and the dull
    concussive thunder on the horizon. Far, far away, you hear the squawking of blackbirds, and the hoot of a night owl.

    To continue east, turn to 55. To return north, turn to 51.
- id: 55
  title: THE FOX
  description: >-
    A small, carefully carved wooden statue stands in the center of a grassy glen.

    The statue is of an adolescent fox, standing with one leg jauntily perched on a rock, and his front paws planted on
    his hips. The pose gives him an air of playful insouciance, somehow both charming and bold. He looks as if he’s in
    the middle of a friendly wager or boast. He grins widely, showing off his small pointy teeth.

    At the base of the statue is a painted wooden placard.

    “O fair-weather friend, look ‘pon me and see ‘cross wet fields and forests I do decree;

    That no wolf nor dark thorn e’er troubles me! For I am the Fox of the Roses Three!

    I take what I want, I go where I please! I feast at the castle, I sleep in the leaves! I sing by the fire, I bark at
    the sea!

    For I am the Fox of the Roses Three!

    Luck be my birthright, my fortunes be green! Your chase is too slow! Your snares I have seen! I’m a bound’s length
    ‘head when I choose to leave For I am the Fox of the Roses Three.”

    USE ROSES (ALL THREE): As if guided by foresight or whimsy, you place the roses between the teeth of the grinning
    fox. You moment you do, you hear the clacking of wind chimes far off in the woods. Suddenly you catch sight of a
    sparkling light below you. At the bottom of the placard, beneath the poem, there now shines a new line of words in
    swirling cursive and radiant silver ink: “...With our brethren of the wood...”

     The glen is now silent and still but for the falling of the rain on thorns. You now see a small opening of a tunnel in the thorn wall you did not notice before.
    If you wish to head back west from whence you came, turn to 54. If you wish to head into the thorn tunnel, turn to
    39.
- id: 56
  title: THE BUNDLED THING
  description: >-
    You emerge into a small brick courtyard, surrounded by dense bushes. Puddles of rain collect on the brick under-paw.
    To the south is a stone archway from which hangs a lantern. The sputtering flame illuminates the space in weak,
    undulating light.

    In one corner, just out of reach of the light is a large burlap bundle, wrapped in heavy rope.

    LOOK - BUNDLE: Your are on edge as you approach the bundle. You notice several bluish silver runes on the burlap
    sacking. You reach out a paw to open it and see what is inside when suddenly the sack shifts violently, and emits a
    terrible smell. So startled are you by the bundle that you let out a yelp and fall back onto the bricks. Your
    instincts scream at you that whatever is inside must not be let out.

    If you wish to head west, turn to 48.

    If you wish to head through the archway to the south, turn to 57.
- id: 57
  title: THE FIGURE
  description: >-
    You move cautiously through the stone arch in the thorn wall and into a darkened dead-end space. The sputtering
    flame from the lantern in the archway extends only so far into the area, but what it illuminates fills you with
    utter dread.

    At the far end of the grass, wreathed in shadow and lurking behind a bronze rain cistern, is an enormous dark
    figure. Though the lantern light is not strong enough to illuminate its body, its eyes reflect the flame in a
    malevolent red flickering glow. You are being watched with ill intent.

    LOOK - FIGURE: Your eyes begin to adjust to the effect of the lantern light, and you realize that the thing in the
    darkness is in fact a topiary sculpture of a redwood wolf. Its bent and sculpted branches look like dark amber in
    the rain, and are woven through with wicked thorn brambles. You know it is just a bush, but the flickering glass
    eyes study you with unmistakable malice. In its bared fangs is a RED ROSE (ITEM).

    LOOK - RED ROSE (ITEM): The rose in the maw of the wolf is a freshly cut, fragrant rose. Among the thorny fangs of
    the sculpture, the vibrant red petals give the illusion of fresh blood on its teeth.

    To return north, turn to 56.
- id: 58
  title: THE BRIDGE PARAPET
  description: >-
    The path over the bridge is ill-worn. Some paving stones have collapsed into the stream below leaving wide gaps in
    the span. Over these holes in the path, someone has placed large wooden boards to serve as a walkway. The boards are
    waterlogged and dark with rot.

    You decide to play it safe and spring onto the low stone parapet wall. With all the grace of your feline blood, you
    pick your way along the wall top to cross the bride with ease.

    As you cross, you hear a disturbing, disgruntled rumbling below you. To head east onto the Eastern Bank Path, turn
    to 59.

    To return west from the bridge, turn to 18.
- id: 59
  title: THE EASTERN BANK PATH
  description: >-
    The rain has eased, mercifully, but now a very cold wind blows in from the north. You shake the rain out of your fur
    and rub your shoulders with your paws for warmth. Above, the clouds part somewhat, revealing an enormous pale moon
    low on the horizon that illuminates the strange terrain before you. In front of you, the path immediately splits
    into two directions to the north and east.

    To the north, you see a low hill topped by some kind of monument, silhouetted black in the pale moonlight. If you
    wish to head this direction, turn to 60.

    To the east, you see an unusual structure half-hidden behind a circle of swaying pine trees, and catch the scent of
    wood smoke. If you wish to head in this direction, turn to 61.

    To return west over the bridge, turn to 58.
- id: 60
  title: THE FOUNTAIN OF MOSS
  description: >-
    You climb the low hill to the dark monument and discover it is a very large marble fountain. Only a trickle of
    silver water runs through its spigots or collects in its basin, as the fountain is covered entirely by thick, turfy
    moss. In the main spigot at the top of the fountain grows a cluster of delicate white star-shaped moss flowers.

    LOOK - MOSS: The moss is at least several inches think, especially in the large basin at the bottom of the fountain
    and spill out onto the ground around the fountain. Tiny autumnal flower buds of crimson and orange tremble in the
    cold wind and the moonlight. So thick is the moss that you barely notice the decorative statues that perch at the
    head of the fountain.

    You carefully brush some of the moss off of the closest statue to discover a small robed cat holding aloft a wand,
    and several carved words underneath: “...I pledge my wand in service...”

     You make your way around the fountain, carefully removing moss to see find more robed animal statues, including a frog, a fox, a newt and an owl. Each raises a wand in salute, and each is captioned with the same motto: “...I pledge my wand in service...”
    Within moments of your discovery, the fountain burbles loudly to life, a cascade of wet moss cascades out of the
    spigots, and the statues and engravings are completely obscured once more.

    North of the fountain, a faint track leads off into a dark wall of pine trees. If you wish to follow this track,
    turn to 62.

    If you wish to return to the East Bank, turn to

    To follow the track south to the structure you saw in the pine trees, turn to 61.
- id: 61
  title: THE FORTUNE TELLER’S CARAVAN
  description: >-
    In a small campsite clearing behind a wall of dark pines is a large, gaily painted wooden caravan. Its panels are a
    vibrant crimson and deep forest green, and glittering gold-leaf adorns the many ornamental flourishes that decorate
    the exterior. You have never seen a wagon this beautiful or this unusual.

    The caravan’s enormous, gold-gilded wooden wheels rest in a muddy track. Wisps of smoke drift out of a tall stove
    pipe chimney from the roof and into the misty night air. A brightly painted wooden sign hangs over the curved steps
    leading to the front door. The wagon looks completely at peace in the little pine clearing and it likely hasn’t
    moved in years. This ostentatious vardo is someone’s home.

    LOOK - SIGN: The red hand-painted sign hangs over the front doors of the wagon. In elaborate cursive script that
    sparkles gold and silver in the moonlight, you read, “Madame Ermina’s Divinations! Spectacular and Oracular!
    Fortunes Sold, Fortunes Told!”

    If you wish to enter the caravan, turn to 64.

    If you wish to head north to the monument on the hill, turn to 60.

    To the south, the path heads into a steep-sided ravine, thick with pine trees. If you wish to follow the path south
    through the pines, turn to 65.
- id: 62
  title: THE NIGHTSHADE GARDEN
  description: >-
    The track leading north from the monument is at first easy to follow in the bright moonlight. When it reaches the
    tall wall of pines, however, it disappears into inky darkness. Here, no light penetrates the trees. You can hear no
    owls or crows, just the hushed swaying of the pine boughs in the wind.

    Deeper in the woods, the track runs alongside a low, tumbled-down stone wall, seemingly forgotten and half- buried
    in fallen pine needles. You follow the path into a hollow, where the air feels unnaturally still. Here, hidden by
    the pressing trees, you find a strange and dreadful little garden.

     Tended rows of stalks of deadly nightshade bow heavy with clusters of gleaming black berries. Pale blossoms of moonflower hang still and funereal from trellises overhead.
    A small wooden table covered in pestles and mortars, clay bowls, filthy glass bottles and wax figurines stands to
    one side of the garden under a canvas tent.

    A bit further along the track is a small enclosed den lit by a low, flickering glow. If you wish to return to the
    fountain, turn to 60.

    If you wish to enter the den, turn to 63.
- id: 63
  title: THE SPRITE AND THE POISON STILL
  description: >-
    You cautiously make your way into the den as a reek of noxious gas assaults your senses. You are dizzy from the
    fumes, and it takes you a moment to comprehend what is going on in this little hovel.

    In front of you is a large copper still set over a low fire. The metal rattles as mash boils and bubbles in the pot.
    At the top of the still, vapor condenses and drips down a long curved swans neck pipe to a cooling pot on the floor
    next to fire.

    Stained buckets of deadly nightshade berries and a workbench covered in glass bottles, filled with a purple
    tincture, tightly corked and sealed in black wax are all the clues you need to know what is happening; someone is
    distilling poison.

    It turns out the that someone is in the den with you right now. A small figure in dark robes stands with its hunched
    back to you as it work mashing nightshade berries in a stone bowl. It stops when it hears you at the door and slowly
    turns its hooded head to face you.

    You would never wish this face to appear in even your enemy’s nightmares. This wicked sprite has an indescribably
    hideous face; its long bulbous nose is covered in soot from huffing nightshade powder, and its pale green skin is
    covered in sores and tufts of hair. Venomous yellow eyes seize upon you with malice at your intrusion, and when the
    creature hisses a wordless threat at you, it bares a row of broken and rotten black fangs.

    You attempt to flee, but are overwhelmed by the fumes of the deadly nightshade distillery and can merely stumble
    backwards in horror.

    The last thing you hear is the incongruous screeching of a night owl.

    (NOTE TO DEVELOPER: Here, we send the player back to 9. THE FALLEN TREE)
- id: 64
  title: THE READING
  description: >-
    Your paw shakes with nerves as you knock on the door of the wagon. You hear a startled rustling from within and a
    tumble and clatter of kitchenwares.

    A flustered white stoat in a silk head scarf opens the small circular window in the door and looks at you in
    confusion.

    “Do you... have appointment?” she asks.

    “Um, no, no, I just... noticed your sign, and um...”

    She winks at you.

    “Ah, yes, yes, you do have appointment, Cublink, you just didn’t realize it yet, yes, yes yes...” She closes the
    window in your face, and unlatches the door to welcome you in.

    The inside of the caravan is even more marvelous and colorful than the outside. Bathed in warm candle light, the
    interior is a warren of silk and velvet splendor: plush blue pillows brocaded with silver and copper shuttle weave,
    beaded curtains and tapestries tasseled with gold, lacquered ornamental tables piled high with books and scrolls.
    The room is fascinatingly cluttered with bronze candelabras, crystals of innumerable colors and shapes and sizes,
    clay figurines of mysterious origin, meticulously bejeweled and gold-leafed eggs, painted star charts on papyrus,
    leather scroll cases, bottles of perfumes and jars of strange spices, divination cards, rods and wands, and tucked
    in every nook and hanging on every hook, fabulous cut-glass jewelry. A heady haze of incense from a brass censer
    fills your nose.

    You stare in wonder at the fortune teller’s home and try to stammer out a “thank you...” and an introduction.

    “Let me guess, Cublink...” she looks at you keenly and adjusts her falling headscarf, “you vant to go to
    Lionvorts...”

    You gasp in surprise.

    “How did you know?!”

    She squints and affects a wise nod.

    “Madame Ermina knows much and tells more...”

    “Oh, are you... um, Madame Ermina?”

    She cocks her head quizzically and blinks in disappointment. “Yes, dahlink, try to keep up, yes yes. Yes.”

    Madame Ervina adjusts her head scarf and leads you to the table in the center of the small space and you sit down on
    a soft velvet pillow. It’s the first time you’ve sat down since you leapt through the fireplace of your home back in
    Liondon, and you allow yourself to start to relax.

    Madame Ermina takes your paw in hers and studies your pads and claws. “Hmm, curious...” she mutters to herself.

     “Why, what is it, Madame Ermina?” “SHHHH!” She hisses. “I’m readink...”
    She continues to hold your paw in one of hers and places her other on a crystal globe in front of you on the table.
    She closes her eyes for a long time, and her head scarf begins to slip down again.

    You aren’t sure if you should also close your eyes, but the crystal globe catches your attention first. To your
    amazement, you notice a shimmering light emanating from its depths, followed by a swirling cloud of thousands of
    tiny stars. You are entranced. Suddenly, a small black shape takes form in the crystal, wheeling through the stars.
    As it moves, it begins to swallow their sparkling lights one by one...

    Madame Ermina gasps, drops your paw and opens her eyes to study you intensely. The image in the globe vanishes.

    “Fascinatink...” she whispers to herself.

    “Why, what is it, Madame Ermina?” you ask tremulously.

    She can barely bring herself to speak.

    “Oh, nothink, nothink...” she replies, finally, her eyes nervous. “Erm... vat do you know about wyverns...?”

    You know nothing about wyverns.

    “Are they... like antelopes?”

    Madame Ermina shakes her head and gives a pitying chuckle at your ignorance.

    “No, my darlink, oh sweet Cublink, no...”

    She sighs.

    “But it is not written that I should tell you about them tonight...”

    You are about to protest, but she hushes you before you can say anything.

    “Shh, shh, shh, yes, yes. I will tell you one small fortune, however, gratis...”

    You’re not sure what that means, but you nod eagerly.

    “You will reach Lionvorts tonight. But...”

    She scuttles down from the table and pulls out a small wooden cigar box from beneath one of the cushions in the back
    of the room.

    “you will need this before you get there...”

    LOOK - CIGAR BOX: You open the cigar box with no small amount of excitement. On a bed of red velvet, is a black eye
    patch with a black leather head strap. In the center of the eye patch is a magnificent black CROW’S EYE (ITEM).

     LOOK - CROW’S EYE (ITEM): The crow’s eye patch is fashioned of simple black leather, but seems to radiate magical properties. Upon closer inspection, several silver runes are imprinted on the backside of the patch. They seem to almost make sense to you.
    “You must make great haste, Cublink,” she says. “It getting late in the night, and you have urgent appointment.”

    You nod and thank her profusely for her hospitality.

    “And if I may offer you a varning...” she whispers darkly. “You must vatch the skies...” To leave the caravan, turn
    to 61.
- id: 65
  title: THE PINE WAY
  description: >-
    The path enters a narrow, stoney, steep-sided ravine, and the pine trees on the hills on either side of you are
    close-set and dark. The full moon breaks through the clouds frequently enough to light a clear way forward. You are
    startled when a rock clatters down one of the hillsides and frightens a large colony of bats into flight. They flap
    and dart chaotically through the air over your head, but a moment later, you are alone.

    To the south, the path leads to a round, rocky hillock. To head in this direction, turn to 66. To the north, the
    path leads back to the caravan. To head in this direction, turn to 61.
- id: 66
  title: THE RUINS ON THE HILLOCK
  description: >-
    This bare, round hill rises out of the ravine and offers you a view of the surrounding area, as bathed in the pale
    silver moonlight. You see that you are in a vast and craggy pine forest that stretches north, east, and south for
    many uninterrupted miles. Across the wide stream to the west, the pines gives way to deciduous trees, their bare
    branches shining from the night’s relentless rain. Far upstream, you see the silhouette of a mill wheel leaning
    heavily into the water, and even farther north, the arches of a stone bridge.

    Rain still falls sporadically on the woods and hills west beyond the stream.

    A brisk wind rises around you. You hear it rushing through bottom of the ravine and in the boughs of the pines in
    the hills. It is a terribly lonely sound, but it is soon joined in chorus by another.

    On the south end of the hilltop stands a low, partially ruined stone tower. From this spire you hear a plaintive,
    haunting moan. Though you cannot tell what animal calls, you find it deeply troubling and achingly sad.

    Near the base of the hill, you see a ring of low walls of a long-ago ruined stone building. Curiously, one perfectly
    preserved stone archway stands amidst one of these walls. In the archway hangs a wooden door.

    If you wish to investigate the tower, turn to 67.

    If you wish to investigate the ruins and door, turn to 68.

     If you wish to return north to the ravine, turn to 65.
- id: 67
  title: THE SINGING TOWER
  description: >-
    The tower stands, but only barely. Its once-proud stone blocks lean crookedly atop one another, their edges worn by
    centuries of rain and wind. Where once they fit flush, wide gaps now yawn, the mortar having eroded away long ago.
    You realize that the sad moaning may have come from the tower itself.

    It was just the wind in the crevices.

    There is an arched stone entryway to the tower, and beyond, a flight of circular stairs rising to the top of the
    spire.

    On the south side of the tower, you glimpse a dark figure sitting under a thin tree, but when wind picks up and the
    tower sings once again, the figure is gone.

    LOOK - ENTRYWAY: In the rough-hewn stone overhead are scratched jagged silver letters that read:

    “Here you may see

    what might and should be.”

    To approach the dark figure and thin tree south of the tower, turn to 70. To enter the archway and climb the old
    stairs, turn to 71.

    To return to the hillock, turn to 66.
- id: 68
  title: THE STONE DOOR
  description: >-
    You make your way down the slope of the hillock to the ruined walls and the door. Whatever building once stood here
    must have been very large and very grand, as the walls stretch farther in the darkness than you can see. In some
    places, turf has reclaimed what is left of the walls, subsuming the rock in waist-high grassy mounds. In other
    places, the stones are still visible, but so weathered now as to almost seem a part of the landscape.

    It is for this reason that the incongruous image of the perfectly preserved doorway standing in these ruined walls
    haunts you.

    It feels intentional.

    Perfectly flush in the stone archway is a weathered oak door, its iron crossbeam, studs, and round knocker gleaming
    in the moonlight.

    LOOK - CROSSBEAM: Your keen feline eyes catch the sight of embossed lettering on the crossbeam. You lean in closely
    and squint in the dark to read:

     Let no fist shake the door No key unlatch the beam But the Oath as spoken May light the way agleam.
    (NOTE TO SWIFTWOL: This is the final puzzle of the game. When a character speaks the Oath (as collected throughout
    the game in various puzzles, etc), they unlock the doorway in to Lionworts. Players must SPEAK:

    “In the solemnest covenance With our brethren of the wood I pledge my wand in service

    To the coven and the good.”)

    To enter the door (once unlocked), turn to 69. To return west to the hillock, turn to 66.
- id: 69
  title: THE LIONWORTS COURTYARD
  description: >-
    Upon speaking the words of the Oath, you hear the door unlock itself and slowly swing open. The sight that awaits
    you on the other side astounds you.

    The modest wooden door opens to reveal not a moonlit field of ruins and grass, but a large stone-paved courtyard
    ringed by impressive dark gray walls, their weathered blocks cut with long rows of pointed gothic windows. Each is
    latticed with lead. Some windows flicker from firelight within, some are dark, and others host a single candle flame
    as a greeting. The courtyard glimmers like a lantern lit from many sides.

    The ground under your paws is laid with a checkered pattern of ancient flagstones. Tonight’s rain has pooled in the
    gaps between the stones, and reflects the rising towers like broken mirrors. Before you, a magnificent marble
    fountain in the shape of a towering white tree spills water into stone pools, into which dozens of smaller orchard
    trees stretch their roots. Even in the moonlight, you can see their foliage ablaze in autumnal glory.

    Above you, the courtyard walls climb into spires, arches, and buttresses that twist dizzyingly toward the dark sky.
    Grotesques and gargoyles leer down from their perches on the walls and ledges; owls with too many eyes, lions with
    wings, toads with enormous manes. All of which seem to be watching your every more.

    The gargoyles are studying you.

    You walk slowly forward, stupefied by the sight of the cloisters and arcades that ring the courtyard, when suddenly
    you hear the hoot of an owl in one of the trees closest to the entrance of the main building. You bound across the
    courtyard, hoping to meet your strigine messenger and your evening’s stealthy guide, but when you get to the
    enormous oak doors, you find yourself alone again.

    There is a parchment nailed to the enormous oak doors, however, and the word written on it is frightening and
    strange:

    “HELP!

     Signed,
    Llewellyn Bonisagus

    Wizard of the Nineteenth Order (ret.) Lionworts Dean of Admissions Seventh Cub of a Seventh Litter

    P.S. Congratulations on reaching Lionworts! Very few novices make it past the bridge troll.

    P.P.S. Unfortunately, as you may have surmised, Orientation is canceled for reasons... most peculiar and dangerous.

    P.P.P.S. What do you know about wyverns?

    P.P.P.P.S. Why are you still reading this?! Get in here!”

    With a pounding heart and your stomach in knots, you open the door and enter the darkened school.

    ***

    Congratulations, Cub!

    You have successfully found your dangerous way to the Lionworts Academy for Preternaturally Gifted Cubs at the
    Lionworts School of Magick, just in time for Orientation on the Night of the Serpent Moon.

    Unfortunately, your welcome festivities have been interrupted by danger most foul, and you will need to rely on your
    wits and courage to survive.

    Please return for the next adventure with as you explore the wonders and mysteries of the Lionworts School of Magick
    coming soon.
- id: 70
  title: THE THIN TREE
  description: >-
    You move slowly toward the thin tree at the edge of the hilltop.

    It is dark and leafless, a young aspen separated from its grove, its branches little more than sprigs. At the end of
    one tremulous branch hangs a red paper lamp, lit by a tiny candle. The lantern rocks in the wind, throwing faint
    flickering light on the ground below.

    What most catches your attention, however, is the figure seated beneath the feeble paper lamp.

    Hooded and swathed in dark robes, it leans heavily on a staff of walnut wood. You cannot see the mysterious figure’s
    face or features..

    “Come, Cubling. Be not afraid. Sit with me, while there’s still time.”

    With a cautious step, you move toward the stranger, and sit upright on the wet ground, your tail curled around your
    paws for warmth. You attempt to peer into the darkness of the stranger’s deep hood, but the light of the candle is
    too weak to offer help.

    You introduce yourself, and can’t stop yourself from asking, “Who are you?”

     The stranger nods once sagely.
    “You are what is, Cubling, I am what will be.”

    Just great. More riddles.

    “You have seen much in your short time in this forest, and in this world,” the stranger says.

    You almost start blurting out some of tonight’s adventures, but you realize this person must know about them
    already. You simply nod.

    “You have seen much tonight, but now you must learn.”

    The wind picks up some, moaning through the ravine and the tower behind you. “What am I to learn?”

    The flame sputters in the wind.

    “The lesson... of time.”

    You concentrate, trying to understand.

    “Time shapes us whether we wish it to or not. And the better magicks, the truer magicks, know this. They understand
    the rhythms of life. They respect that inexorable flow. Like a leaf upon a stream, we must travel upon the current
    of time.”

    You are transfixed by this stranger, even if you’re not sure what it’s talking about.

    “This is why spells are born in the movements of stars. They are written in moon dials. The are honor growing
    things. They are spoken through music and in poems. To study magic, one must study the rhythm of the world, and the
    rhythm of the words that shape it. All things are made magical in time and through time.”

    You remember all of the magic poems and riddles tonight, not realizing how many were actually spells...

    “Be not afraid of the passage of time, Cubling. One day you will understand it well. When you learn its deeper
    rules, you will also learn its secrets. But know this: what time takes from us was never really ours. What it gives
    to us is only for a day.”

    “I don’t think I understand yet,” you admit. “You will.”

    The wind shakes the paper lamp overhead. “Will I see you again?”

    The stranger chuckles quietly to itself at your question.

    “Yes. Most assuredly. I have remembered this moment, for we are here now, and you will remember this moment, for we
    will be here again. Mind this in the meantime: be faithful to your Oath. Be true to your covenants. Like this
    quivering lone aspen above us, stronger in its grove, you must find strength and faith in your fellowships to come.”

     You wonder idly to yourself about planting more aspens on this hill to protect the tree. The stranger nods its head.
    “That would be a kindness greater than you might know.”

    You gasp as you realize the stranger seems to have known your thoughts.

    “How did you...”

    “I didn’t. I didn’t read your thoughts, Cubling. I remember my own.”

    A sudden gust of cold wind rushes out of the ravine, and moans in the tower. Ragged clouds hurry by overhead, and
    suddenly, the lamp in the branch is blown out. The stranger looks to the sky for a brief moment, and in the
    moonlight you see his face for the first time.

    You are startled, but somehow not scared, to see the smooth, bleached white skull and bared fangs of a skeletal
    Lion.

    In the next moment, he is gone.

    You are alone with the dark, thin tree, the moonlight shining coldly upon you. To return to the tower, turn to 67.
- id: 71
  title: THE TOWER STAIRS
  description: >-
    You make your way carefully up the stairs of the ruined tower, taking care to test each step before leaning with
    your entire weight. The stones are cold underpaw.

    You emerge from the top of the tower onto a narrow platform, open to the sky above. Here, starlight shines down on a
    white marble plinth. On the top of this small column, resting in a bowl of fresh rainwater, is a small silver orb.

    LOOK - SILVER ORB: The polished orb is spinning slowly and smoothly in the rainwater of its own accord. On its
    gleaming mirrored face, you see four symbols inscribed: a bushy foxtail, a broken tree, an arched window, and a
    fountain.

    On the lip of the marble bowl is a star-shaped indentation.

    USE - AMULET: You unclasp the blacksmith badger’s amulet from the chain, and insert it into the star- shaped
    indentation in the marble bowl. Immediately, the oracular metal hums with intention. The starlight above slowly and
    steadily focuses and brightens on the amulet, as if the charm were collecting the light out of the very sky above
    for its own purpose. Within a few moments, the amulet and the rainwater are dazzlingly bright in concentrated
    starlight.

    The orb begins to spin faster and faster in the bowl. You watch in amazement as it refracts the concentrated
    starlight on the stone walls around you. Suddenly, the orb ceases its rotation all at once, and projects a mirrored
    image of the first inscription on the stones: the outline of the window. The orb resumes its blinding

     spin, and stops suddenly once again, now projecting the image of the fox tail. The orb spins a third time, landing on the fountain, and then finally, it settles on the broken tree. The reflected image of the tree fades on the wall, the starlight in the bowl dims, the orb sits heavy in the water, and the amulet ceases to hum.
    What in Lionworts did you just witness?

    LOOK - SKY:

    For the first time tonight, the clouds have parted enough for you to see a vast field of stars above. Nights are
    never this dark and clear back at home, and you are amazed by the clarity of the innumerable stars you are seeing
    for the first time. You begin to lose yourself in wonder at the celestial view, when suddenly a strange cloud drifts
    in front of the stars, blotting them out of view. The cloud moves quickly and then doubles back again. You realize
    with a shudder that what you are seeing is not a cloud, but a large winged thing wheeling on the wind far off over
    the forest. It vanishes from view before you can identify the creature, but your instincts scream at you to hide
    from its searching gaze.

    To head back down the stairs and exit the tower, turn to 67.
